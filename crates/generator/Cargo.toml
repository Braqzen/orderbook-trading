[package]
name = "generator"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
maiya = { git = "https://github.com/Braqzen/maiya.git", tag = "v0.1.0" }
prost = "0.14.4"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.release]
debug = 1
