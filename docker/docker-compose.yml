# Shared configuration for services
x-common-env-telemetry: &common-env-telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry-alloy:4318
  OTEL_METRIC_EXPORT_INTERVAL: "1000"

x-orderbook-env: &orderbook-env
  RUST_LOG: info
  GRPC: 0.0.0.0:8003
  REDPANDA_BROKERS: redpanda:9092
  <<: *common-env-telemetry

x-orderbook: &orderbook
  image: orderbook-trading-orderbook:latest
  depends_on:
    telemetry-alloy:
      condition: service_started
    redpanda-init:
      condition: service_completed_successfully
  restart: unless-stopped

x-orderbook-gateway-env: &orderbook-gateway-env
  RUST_LOG: info
  WS: 0.0.0.0:8002
  REDPANDA_BROKERS: redpanda:9092
  <<: *common-env-telemetry

x-orderbook-gateway: &orderbook-gateway
  image: orderbook-trading-orderbook-gateway:latest
  restart: unless-stopped

services:
  price-generator:
    image: orderbook-trading-price-generator:latest
    environment:
      RUST_LOG: info
      CONFIG_PATH: /app/config/price-generator.json
      SOCKET: 0.0.0.0:8000
      <<: *common-env-telemetry
    depends_on:
      telemetry-alloy:
        condition: service_started
    restart: unless-stopped

  price-aggregator:
    image: orderbook-trading-price-aggregator:latest
    environment:
      RUST_LOG: info
      PRICE_GENERATOR_URL: http://price-generator:8000
      VALKEY_URL: redis://valkey:6379
      PRICE_TTL_SECONDS: "5"
      <<: *common-env-telemetry
    depends_on:
      telemetry-alloy:
        condition: service_started
      price-generator:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--dir",
        "/data"
      ]
    volumes:
      - valkey-data-volume:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  market-data-gateway:
    image: orderbook-trading-market-data-gateway:latest
    environment:
      RUST_LOG: info
      WS: 0.0.0.0:8001
      VALKEY_URL: redis://valkey:6379
      INSTRUMENTS_CONFIG_PATH: /app/config/instruments.json
      <<: *common-env-telemetry
    depends_on:
      telemetry-alloy:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: orderbook-trading-client:latest
    environment:
      RUST_LOG: info
      CONFIG_PATH: /app/config/client.json
      MARKET_DATA_GATEWAY_URL: ws://market-data-gateway:8001
      VALKEY_URL: redis://valkey:6379
      <<: *common-env-telemetry
    depends_on:
      telemetry-alloy:
        condition: service_started
      market-data-gateway:
        condition: service_started
      valkey:
        condition: service_healthy
      orderbook-gateway-eth:
        condition: service_started
      orderbook-gateway-btc:
        condition: service_started
      orderbook-gateway-sol:
        condition: service_started
      orderbook-gateway-xmr:
        condition: service_started
      orderbook-gateway-xrp:
        condition: service_started
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data-volume:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      RPK_BROKERS: redpanda:9092
      RPK_ADMIN_HOSTS: redpanda:9644
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk cluster config set auto_create_topics_enabled false --no-confirm &&
        rpk topic create execution-ETH-USD execution-BTC-USD execution-SOL-USD execution-XMR-USD execution-XRP-USD --partitions 4 --replicas 1 --if-not-exists
    restart: "no"

  orderbook-eth:
    <<: *orderbook
    environment:
      <<: *orderbook-env
      INSTRUMENT: "ETH-USD"

  orderbook-btc:
    <<: *orderbook
    environment:
      <<: *orderbook-env
      INSTRUMENT: "BTC-USD"

  orderbook-sol:
    <<: *orderbook
    environment:
      <<: *orderbook-env
      INSTRUMENT: "SOL-USD"

  orderbook-xmr:
    <<: *orderbook
    environment:
      <<: *orderbook-env
      INSTRUMENT: "XMR-USD"

  orderbook-xrp:
    <<: *orderbook
    environment:
      <<: *orderbook-env
      INSTRUMENT: "XRP-USD"

  orderbook-gateway-eth:
    <<: *orderbook-gateway
    environment:
      <<: *orderbook-gateway-env
      INSTRUMENT: "ETH-USD"
      ORDERBOOK_URL: http://orderbook-eth:8003
    depends_on:
      telemetry-alloy:
        condition: service_started
      redpanda:
        condition: service_healthy
      orderbook-eth:
        condition: service_started

  orderbook-gateway-btc:
    <<: *orderbook-gateway
    environment:
      <<: *orderbook-gateway-env
      INSTRUMENT: "BTC-USD"
      ORDERBOOK_URL: http://orderbook-btc:8003
    depends_on:
      telemetry-alloy:
        condition: service_started
      redpanda:
        condition: service_healthy
      orderbook-btc:
        condition: service_started

  orderbook-gateway-sol:
    <<: *orderbook-gateway
    environment:
      <<: *orderbook-gateway-env
      INSTRUMENT: "SOL-USD"
      ORDERBOOK_URL: http://orderbook-sol:8003
    depends_on:
      telemetry-alloy:
        condition: service_started
      redpanda:
        condition: service_healthy
      orderbook-sol:
        condition: service_started

  orderbook-gateway-xmr:
    <<: *orderbook-gateway
    environment:
      <<: *orderbook-gateway-env
      INSTRUMENT: "XMR-USD"
      ORDERBOOK_URL: http://orderbook-xmr:8003
    depends_on:
      telemetry-alloy:
        condition: service_started
      redpanda:
        condition: service_healthy
      orderbook-xmr:
        condition: service_started

  orderbook-gateway-xrp:
    <<: *orderbook-gateway
    environment:
      <<: *orderbook-gateway-env
      INSTRUMENT: "XRP-USD"
      ORDERBOOK_URL: http://orderbook-xrp:8003
    depends_on:
      telemetry-alloy:
        condition: service_started
      redpanda:
        condition: service_healthy
      orderbook-xrp:
        condition: service_started

  telemetry-grafana:
    image: grafana/grafana:12.2
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../telemetry/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data-volume:/var/lib/grafana
    depends_on:
      - telemetry-loki
      - telemetry-prometheus
    restart: unless-stopped

  telemetry-prometheus:
    image: prom/prometheus:v3.5.4
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ../telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data-volume:/prometheus
    restart: unless-stopped

  telemetry-loki:
    image: grafana/loki:3.7
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ../telemetry/loki/loki.yaml:/etc/loki/loki.yaml
      - loki-data-volume:/loki
    restart: unless-stopped

  telemetry-alloy:
    image: grafana/alloy:v1.17.0
    volumes:
      - ../telemetry/grafana/alloy:/etc/alloy
      - alloy-data-volume:/var/lib/alloy/data
    command: run --disable-reporting /etc/alloy/config.alloy
    depends_on:
      - telemetry-loki
      - telemetry-prometheus
    restart: unless-stopped

volumes:
  valkey-data-volume:
  redpanda-data-volume:
  grafana-data-volume:
  loki-data-volume:
  prometheus-data-volume:
  alloy-data-volume:
